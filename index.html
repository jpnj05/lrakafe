    <meta

      content="LraKafe: small-batch coffee, house-made syrups, and warm corners in Jaro, Iloilo City."

    <meta property="og:image" content="/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <title>LraKafe · Slow coffee, warm corners</title>
    <script>
      // The hero is client-rendered, so start its image download before React mounts.
      if (location.pathname === '/') {
        const hero = document.createElement('link')
        hero.rel = 'preload'
        hero.as = 'image'
        hero.type = 'image/webp'
        hero.href = '/images/hero-interior-960.webp'
        hero.setAttribute(
          'imagesrcset',
          '/images/hero-interior-640.webp 640w, /images/hero-interior-960.webp 960w, /images/hero-interior-1392.webp 1392w',
        )
        hero.setAttribute('imagesizes', '(min-width: 992px) 560px, 92vw')
        hero.fetchPriority = 'high'
        document.head.appendChild(hero)
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Manrope:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
